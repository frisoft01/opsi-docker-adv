name: homelab

services:
  mariadb:
    container_name: homelab-mariadb-1
    restart: unless-stopped
    hostname: ${MYSQL_HOST}
    networks:
        - opsi-server_default
    environment:
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
        - MYSQL_INITDB_SKIP_TZINFO=1
        - MYSQL_DATABASE=${MYSQL_DATABASE}
        - MYSQL_USER=${MYSQL_USER}
        - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    image: mariadb:10.7
    command: --port 3306 --max_connections=1000 --max_allowed_packet=256M --sort_buffer_size=4M
    volumes:
    - mysql_data:/var/lib/mysql
    
volumes:
  mysql_data:
    driver: local # Define the driver and options under the volume name
    driver_opts:
      type: none
      device: /data/mysql_data
      o: bind
networks:
  opsi-server_default:
    driver: bridge
    name: opsi-server_default
